name: Build test APK

# MANUAL ONLY (Actions page → Build test APK → Run workflow): regression
# tests + a signed RELEASE-VARIANT APK published to the rolling "test-build"
# PRERELEASE. Never triggers on pushes. The prerelease is not "latest" (v1.x
# releases keep that badge) and its asset is overwritten each run — the
# download page needs no GitHub login, unlike workflow artifacts. Release
# variant because debuggable=true sideloads failed to install on both owner
# devices; real releases go through release.yml (tag v* => publish).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install preview toolchain
        working-directory: tools
        run: npm install --no-audit --no-fund

      - name: Preview pipeline regression tests
        run: node tools/mdtest/run.js

      - name: Build preview bundle
        run: ./scripts/build-preview.sh

      - name: Shipped bundle matches TypeScript sources
        run: git diff --exit-code app/src/main/assets/preview/bundle.js

      - name: Build release APK (signed, debuggable=false)
        # Release variant: matches production behavior and ships the same
        # signing key as releases, so rolling builds update over them.
        # (History: the v1.1.1-era install failures were caused by a manifest
        # <queries> bug — INSTALL_PARSE_FAILED_MANIFEST_MALFORMED, one data
        # scheme per <intent> — fixed in c43fa84; the earlier "debuggable is
        # the prime suspect" theory in this comment was wrong and is kept
        # out on purpose. Debug-variant APKs install fine.)
        run: ./gradlew :app:assembleRelease --console=plain
        env:
          MATHMD_RELEASE_STORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          MATHMD_RELEASE_STORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
          MATHMD_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}

      - name: Move rolling tag to this commit
        # action-gh-release does NOT move an existing tag, so without this
        # the second run would publish a new APK under the first commit's
        # tag. Force-moving `test-build` keeps the release pointing at the
        # commit actually built. (Does not trigger release.yml: no v* match.)
        run: |
          git tag -f test-build
          git push -f origin refs/tags/test-build

      - name: APK checksum
        id: sum
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          echo "sha256=$(sha256sum $APK | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "bytes=$(stat -c%s $APK)" >> "$GITHUB_OUTPUT"

      - name: Publish rolling test prerelease
        # Fixed tag `test-build` (no v* prefix => release.yml never fires on
        # it); asset overwritten every run, so the link never goes stale.
        # Signed with the release key (ac1ca1e) => installs over released
        # versions without uninstalling.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: test-build
          name: MathMD test build (rolling)
          prerelease: true
          make_latest: false
          overwrite_files: true
          generate_release_notes: false
          body: |
            Rolling **release-variant** build from `${{ github.sha }}` — manual
            trigger only. Signed with the release key (installs as an upgrade
            over released versions). Not an official release; official versions
            live in Releases under `v*` tags.

            **Verify your download** (truncated downloads are a common install
            failure — "解析软件包时出现问题"):
            - size: `${{ steps.sum.outputs.bytes }}` bytes
            - SHA-256: `${{ steps.sum.outputs.sha256 }}`
          files: app/build/outputs/apk/release/app-release.apk
