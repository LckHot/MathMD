name: Build test APK

# Manual test builds ONLY (Actions page → Build test APK → Run workflow):
# regression tests + debug APK uploaded as a workflow artifact. No release
# build, no signing secrets, nothing is published. Real releases go through
# release.yml, which stays tag-only (push v* => tests + debug + signed
# release APK + GitHub Release).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install preview toolchain
        working-directory: tools
        run: npm install --no-audit --no-fund

      - name: Preview pipeline regression tests
        run: node tools/mdtest/run.js

      - name: Build preview bundle
        run: ./scripts/build-preview.sh

      - name: Shipped bundle matches TypeScript sources
        run: git diff --exit-code app/src/main/assets/preview/bundle.js

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mathmd-test-debug
          path: app/build/outputs/apk/debug/app-debug.apk
