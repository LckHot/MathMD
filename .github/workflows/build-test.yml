name: Build test APK

# MANUAL ONLY (Actions page → Build test APK → Run workflow): regression
# tests + debug APK published to the rolling "test-build" PRERELEASE.
# Never triggers on pushes. The prerelease is not "latest" (v1.x releases
# keep that badge) and its asset is overwritten each run — the download
# page needs no GitHub login, unlike workflow artifacts. Real releases go
# through release.yml (tag v* => signed release + publish).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install preview toolchain
        working-directory: tools
        run: npm install --no-audit --no-fund

      - name: Preview pipeline regression tests
        run: node tools/mdtest/run.js

      - name: Build preview bundle
        run: ./scripts/build-preview.sh

      - name: Shipped bundle matches TypeScript sources
        run: git diff --exit-code app/src/main/assets/preview/bundle.js

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Move rolling tag to this commit
        # action-gh-release does NOT move an existing tag, so without this
        # the second run would publish a new APK under the first commit's
        # tag. Force-moving `test-build` keeps the release pointing at the
        # commit actually built. (Does not trigger release.yml: no v* match.)
        run: |
          git tag -f test-build
          git push -f origin refs/tags/test-build

      - name: Publish rolling test prerelease
        # Fixed tag `test-build` (no v* prefix => release.yml never fires on
        # it); asset overwritten every run, so the link never goes stale.
        # Signed with the release key (ac1ca1e) => installs over released
        # versions without uninstalling.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: test-build
          name: MathMD test build (rolling)
          prerelease: true
          make_latest: false
          overwrite_files: true
          generate_release_notes: false
          body: |
            Rolling debug build from `${{ github.sha }}` — manual trigger only.
            Signed with the release key (installs as an upgrade over released
            versions). Not an official release; official versions live in
            Releases under `v*` tags.
          files: app/build/outputs/apk/debug/app-debug.apk
