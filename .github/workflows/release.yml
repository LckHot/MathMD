name: Release

# Builds run ONLY when a version tag is pushed — documentation-only
# commits to main never trigger a compile.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install preview toolchain
        working-directory: tools
        run: npm install --no-audit --no-fund

      - name: Preview pipeline regression tests
        run: node tools/mdtest/run.js

      - name: Build preview bundle
        run: ./scripts/build-preview.sh

      - name: Extract versionName
        id: version
        run: echo "name=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Build signed release APK
        # Fails with a clear message if signing secrets are not configured;
        # configure them once per repository (see docs/signing-setup.md).
        run: ./gradlew :app:assembleRelease --console=plain
        env:
          MATHMD_RELEASE_STORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          MATHMD_RELEASE_STORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
          MATHMD_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: MathMD ${{ steps.version.outputs.name }}
          body_path: release-notes.md
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
