name: Release

# Builds run ONLY when a version tag is pushed — documentation-only
# commits to main never trigger a compile. Manual test builds live in
# build-test.yml (debug APK artifact only, no signing, no publishing).
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install preview toolchain
        working-directory: tools
        run: npm install --no-audit --no-fund

      - name: Preview pipeline regression tests
        run: node tools/mdtest/run.js

      - name: Build preview bundle
        run: ./scripts/build-preview.sh

      - name: Shipped bundle matches TypeScript sources
        # mdtest tests a freshly built bundle; the APK ships the committed
        # one. If this fails, run scripts/build-preview.sh and commit the
        # regenerated bundle.js.
        run: git diff --exit-code app/src/main/assets/preview/bundle.js

      - name: Tag matches versionName
        # Release titles come from the tag; versionName/versionCode come from
        # gradle. A mismatch ships an update the package manager may reject.
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ "v${VN}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != v${VN} in build.gradle.kts" && exit 1
          fi

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Build signed release APK
        # Fails with a clear error if signing secrets are not configured
        # (see docs/signing-setup.md).
        run: ./gradlew :app:assembleRelease --console=plain
        env:
          MATHMD_RELEASE_STORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          MATHMD_RELEASE_STORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
          MATHMD_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        # Tag name is the single source of truth for the release title;
        # versionName in build.gradle.kts only governs the in-app version.
        with:
          name: MathMD ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
