name: Release

# Builds run ONLY when a version tag is pushed — documentation-only
# commits to main never trigger a compile.
#
# workflow_dispatch allows manual test builds (Actions page → Run workflow):
# identical pipeline, but the publish step below is gated to tag runs, so a
# manual run only uploads the APKs as workflow artifacts — nothing is released.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install preview toolchain
        working-directory: tools
        run: npm install --no-audit --no-fund

      - name: Preview pipeline regression tests
        run: node tools/mdtest/run.js

      - name: Build preview bundle
        run: ./scripts/build-preview.sh

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Build signed release APK
        # Fails with a clear error if signing secrets are not configured
        # (see docs/signing-setup.md).
        run: ./gradlew :app:assembleRelease --console=plain
        env:
          MATHMD_RELEASE_STORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          MATHMD_RELEASE_STORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
          MATHMD_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}

      - name: Upload test-build artifacts
        # Manual runs stop here: APKs are downloadable from the workflow run
        # page for testing, no GitHub Release is created.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: apk-test-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        # Only tag pushes publish; manual (workflow_dispatch) runs never do.
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v3
        # Tag name is the single source of truth for the release title;
        # versionName in build.gradle.kts only governs the in-app version.
        with:
          name: MathMD ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
